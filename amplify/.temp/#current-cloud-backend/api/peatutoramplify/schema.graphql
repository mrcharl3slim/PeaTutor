# ==============================================
# Sprint 5 — UPDATED (no user-declared createdAt/updatedAt)
# ==============================================

type Worksheet @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  userId: String!
  title: String!
  fileType: String
  fileName: String!
  s3WorksheetKey: String!
  extractionResult: String
  questionCount: Int
  totalMarks: Int
  uploadedAt: AWSDateTime!
  fileSize: Int
  contentHash: String
  sourceFileHashes: [String]
  lastAccessedAt: AWSDateTime

  # Relationships
  questions: [Question] @hasMany(indexName: "byWorksheetQuestions", fields: ["id"])
  fullWorksheetSolutions: [FullWorksheetSolution] @hasMany(indexName: "byWorksheetSolutions", fields: ["id"])
  homeworkAssignments: [Homework] @hasMany(indexName: "byWorksheet", fields: ["id"])
  metadata: [WorksheetMetadata] @hasMany(indexName: "byWorksheet", fields: ["id"])
}

type Question @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  worksheetId: ID! @index(name: "byWorksheetQuestions", sortKeyFields: ["questionId"])
  userId: String!

  questionId: String!
  questionText: String!
  marks: Int!
  skillsTested: [String]
  hints: String
  stepByStep: String
  answer: String

  isSubpart: Boolean!
  parentQuestionId: String

  # Relationships
  worksheet: Worksheet @belongsTo(fields: ["worksheetId"])
  solutionFeedbacks: [SolutionFeedback] @hasMany(indexName: "byQuestionFeedback", fields: ["id"])
  metadata: [QuestionMetadata] @hasMany(indexName: "byQuestion", fields: ["id"])
}

type SolutionFeedback @model @auth(rules: [
  { allow: owner }
  { allow: private, operations: [read] }
]) {
  id: ID!
  questionId: ID! @index(name: "byQuestionFeedback", sortKeyFields: ["submittedAt"])
  worksheetId: ID! @index(name: "byWorksheetAllFeedback", sortKeyFields: ["submittedAt"])
  userId: String!

  s3SolutionImageKey: String!

  feedback: String!
  isCorrect: Boolean
  suggestions: [String]

  attemptNumber: Int!
  submittedAt: AWSDateTime!

  # Relationships
  question: Question @belongsTo(fields: ["questionId"])

  # AI metadata
  aiModel: String
  tokensUsed: Int
}

type FullWorksheetSolution @model @auth(rules: [
  { allow: owner }
  { allow: private, operations: [read] }   # Teachers can read
]) {
  id: ID!
  worksheetId: ID! @index(name: "byWorksheetSolutions", sortKeyFields: ["submittedAt"])
  userId: String!

  # Existing AI feedback fields
  s3SolutionImageKey: String!
  overallFeedback: String!
  overallScore: Int!
  totalQuestions: Int!
  completedQuestions: [String]
  questionsWithIssues: [String]
  suggestions: [String]
  detailedFeedback: String

  attemptNumber: Int!
  submittedAt: AWSDateTime!

  # Relationships
  worksheet: Worksheet @belongsTo(fields: ["worksheetId"])

  # AI metadata
  aiModel: String
  tokensUsed: Int

  # Optional homework link (submission for homework)
  homeworkId: ID @index(name: "byHomeworkSubmissions")
  homework: Homework @belongsTo(fields: ["homeworkId"])

  # Homework-specific metadata
  isLate: Boolean
  teacherReviewed: Boolean
  teacherNotes: String
  teacherReviewedAt: AWSDateTime
  teacherReviewedBy: String
}

type UserStats @model @auth(rules: [{ allow: owner }]) {
  id: ID!
  userId: String!

  userRole: UserRole

  totalWorksheets: Int!
  totalQuestions: Int!
  totalSolutionsSubmitted: Int!
  totalFeedbackReceived: Int!

  averageScore: Float
  correctAnswersCount: Int!
  totalAttemptsCount: Int!

  lastActiveAt: AWSDateTime
}

# ==============================================
# NEW MODELS - Sprint 4 Multi-User Features
# ==============================================

type UserProfile @model @auth(rules: [
  { allow: owner, ownerField: "userId", operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  userId: ID! @index(name: "byUserId", queryField: "profileByUserId")
  email: String!
  userRole: UserRole!
  displayName: String!
  schoolName: String
  gradeLevel: String
  profileImageUrl: String
  onboardingCompleted: Boolean!
}

type Classroom @model @auth(rules: [
  { allow: owner, ownerField: "teacherId", operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  teacherId: ID! @index(name: "byTeacher", sortKeyFields: ["id"])  # changed from createdAt
  className: String!
  classCode: String! @index(name: "byClassCode", queryField: "classroomByCode")
  subject: String
  description: String
  gradeLevel: String
  isActive: Boolean!

  memberships: [ClassroomMembership] @hasMany(indexName: "byClassroom", fields: ["id"])
  homework: [Homework] @hasMany(indexName: "byClassroom", fields: ["id"])
  studentProgress: [StudentProgress] @hasMany(indexName: "byClassroom", fields: ["id"])
}

type ClassroomMembership @model @auth(rules: [
  { allow: owner, ownerField: "studentId", operations: [create, read, update, delete] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  classroomId: ID! @index(name: "byClassroom", sortKeyFields: ["enrolledAt"])
  studentId: ID! @index(name: "byStudent", sortKeyFields: ["enrolledAt"])
  status: MembershipStatus!
  enrolledAt: AWSDateTime!
  approvedAt: AWSDateTime
  approvedBy: ID

  classroom: Classroom @belongsTo(fields: ["classroomId"])
}

type ParentChildRelationship @model @auth(rules: [
  { allow: owner, ownerField: "childId", operations: [create, update, delete, read] }
  { allow: private, operations: [read, update] }
]) {
  id: ID!
  parentId: ID! @index(name: "byParent", sortKeyFields: ["id"])
  childId: ID! @index(name: "byChild", sortKeyFields: ["id"])
  linkingCode: String! @index(name: "byLinkingCode", queryField: "relationshipByLinkingCode")
  relationshipType: RelationshipType!
  status: LinkStatus!
  approvedAt: AWSDateTime
}

# ==============================================
# Homework & Analytics
# ==============================================

type Homework @model @auth(rules: [
  { allow: owner, ownerField: "teacherId", operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  classroomId: ID! @index(name: "byClassroom", sortKeyFields: ["dueDate"])
  teacherId: ID!

  title: String!
  description: String
  dueDate: AWSDateTime!
  assignedDate: AWSDateTime!
  totalPoints: Int
  isPublished: Boolean!

  worksheetId: ID! @index(name: "byWorksheet")
  worksheet: Worksheet @belongsTo(fields: ["worksheetId"])

  instructions: String
  learningObjectives: String

  allowLateSubmissions: Boolean
  allowMultipleAttempts: Boolean
  maxAttempts: Int

  classroom: Classroom @belongsTo(fields: ["classroomId"])

  submissions: [FullWorksheetSolution] @hasMany(indexName: "byHomeworkSubmissions", fields: ["id"])
}

type HomeworkAnalytics @model @auth(rules: [
  { allow: private, operations: [read] }
  { allow: owner, ownerField: "teacherId", operations: [read, create, update, delete] }
]) {
  id: ID!
  homeworkId: ID! @index(name: "byHomework")
  teacherId: ID!

  # Completion tracking
  totalStudents: Int!
  submittedCount: Int!
  totalSubmissions: Int!
  lateCount: Int!

  # Engagement metrics
  averageAttempts: Float
  multipleAttemptsCount: Int

  # Review tracking
  reviewedCount: Int!
  pendingReviewCount: Int!

  # Aggregated insights
  commonMistakes: String
  strugglingStudents: [String]

  # Timestamps (business-managed)
  lastUpdatedAt: AWSDateTime!
  lastCalculatedAt: AWSDateTime
}

# ==============================================
# Student Progress
# ==============================================

type StudentProgress @model @auth(rules: [
  { allow: owner, ownerField: "studentId", operations: [read, create, update, delete] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  studentId: ID! @index(name: "byStudent")
  classroomId: ID! @index(name: "byClassroom")

  classroom: Classroom @belongsTo(fields: ["classroomId"])

  # Homework completion tracking
  totalHomeworkAssigned: Int!
  totalHomeworkCompleted: Int!
  totalHomeworkLate: Int!

  # Submission patterns
  totalSubmissions: Int!
  averageAttemptsPerHomework: Float

  # Engagement
  currentStreak: Int
  longestStreak: Int

  # Learning patterns
  skillsBreakdown: String
  strengthAreas: [String]
  improvementAreas: [String]

  # Business timestamps
  lastSubmissionAt: AWSDateTime
  progressUpdatedAt: AWSDateTime
}

# ==============================================
# ENUMS
# ==============================================

enum UserRole {
  TEACHER
  STUDENT
  PARENT
}

enum MembershipStatus {
  PENDING
  APPROVED
  REJECTED
  INACTIVE
}

enum RelationshipType {
  PARENT
  GUARDIAN
  TUTOR
}

enum LinkStatus {
  PENDING
  APPROVED
  REJECTED
  REVOKED
}

enum SubmissionStatus {
  NOT_STARTED
  IN_PROGRESS
  SUBMITTED
  REVIEWED
  LATE
}

# ==============================================
# SPRINT 7.1: Deep Worksheet Analytics Engine
# ==============================================

# ==============================================
# Worksheet Metadata (Comprehensive AI analysis)
# ==============================================

type WorksheetMetadata @model @auth(rules: [
  { allow: owner, operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  worksheetId: ID! @index(name: "byWorksheet")
  userId: ID!
  
  # Worksheet-level metadata
  topics: [String!]!                    # ["Addition", "Subtraction", "Fractions"]
  difficulty: String!                   # "Grade 3", "Grade 4", "Grade 5", etc.
  cognitiveSkills: [String!]!          # ["Computation", "Problem Solving", "Reasoning"]
  questionTypes: [String!]!            # ["Multiple Choice", "Word Problem", "Computation"]
  
  # Estimated time and complexity
  estimatedTimeMinutes: Int            # AI-estimated completion time
  complexityLevel: String              # "Easy", "Medium", "Hard", "Very Hard"
  
  # Standards alignment (optional)
  commonCoreStandards: [String]        # ["4.NBT.A.1", "4.NBT.A.2"]
  bloomsTaxonomyLevels: [String]       # ["Remember", "Understand", "Apply", "Analyze"]
  
  # Relationships
  worksheet: Worksheet @belongsTo(fields: ["worksheetId"])
  
  # ==============================================
  # Enhanced WorksheetMetadata (Add curriculum fields)
  # ==============================================
  # ADD these fields to the existing WorksheetMetadata type:
  # MOE Curriculum alignment
  curriculumCountry: String              # "SG"
  curriculumVersion: String              # "2021"
  moeCurriculumCodes: [String]           # ["P2-NA-MD-3.1", "P2-NA-MD-3.2"]
  detectedGradeLevel: String             # "Primary 2" (AI-detected from content)
  curriculumConfidence: Float            # 0.0-1.0 confidence in curriculum mapping
  # ==============================================

  # Metadata
  extractedAt: AWSDateTime!
  aiModel: String!                      # "gpt-4o"
  tokensUsed: Int
}

# ==============================================
# Question Metadata (Enhanced question analytics)
# ==============================================

type QuestionMetadata @model @auth(rules: [
  { allow: owner, operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  questionId: ID! @index(name: "byQuestion")
  userId: ID!
  
  # Question classification
  questionType: String!                 # "Multiple Choice", "Word Problem", "Computation", "Show Your Work"
  difficultyLevel: String!             # "Easy", "Medium", "Hard"
  cognitiveLevel: String!              # "Remember", "Understand", "Apply", "Analyze", "Evaluate", "Create"
  
  # Concepts and skills
  primaryConcept: String!               # "Addition", "Fractions", "Division"
  secondaryConcepts: [String]          # Related concepts
  prerequisiteSkills: [String]         # Skills needed to solve this
  
  # Common errors (AI-predicted)
  commonMistakes: [String]             # ["Forgets to carry", "Sign errors"]
  conceptualChallenges: [String]       # ["Understanding place value"]
  
  # Problem characteristics
  hasMultipleSteps: Boolean!
  requiresVisualization: Boolean!
  isWordProblem: Boolean!
  
  # Relationships
  question: Question @belongsTo(fields: ["questionId"])
  
  # Metadata
  extractedAt: AWSDateTime!
  aiModel: String!
}

# ==============================================
# Concept Mastery Tracking
# ==============================================

type ConceptMastery @model @auth(rules: [
  { allow: owner, ownerField: "studentId", operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  studentId: ID! @index(name: "byStudent", sortKeyFields: ["concept"])
  classroomId: ID @index(name: "byClassroom")
  
  # Concept identification
  concept: String!                      # "Addition", "Fractions", "Division"
  gradeLevel: String                    # "Grade 4", "Grade 5"
  
  # Mastery metrics (0-100)
  masteryPercentage: Float!             # Overall mastery: 0-100
  accuracyRate: Float!                  # % of correct answers
  
  # Attempt tracking
  totalAttempts: Int!                   # Total questions attempted
  correctAttempts: Int!                 # Number correct
  incorrectAttempts: Int!               # Number incorrect
  
  # Trend analysis
  trend: String!                        # "improving", "stable", "declining"
  recentQuestions: Int!                 # Questions in last 7 days
  lastPracticed: AWSDateTime
  
  # Performance breakdown
  easyQuestions: Int!                   # Count of easy questions attempted
  mediumQuestions: Int!
  hardQuestions: Int!
  easyCorrect: Int!                     # Count correct by difficulty
  mediumCorrect: Int!
  hardCorrect: Int!
  
  # Learning insights
  strengthAreas: [String]               # Sub-concepts where student excels
  improvementAreas: [String]            # Sub-concepts needing work
  recommendedPractice: [String]         # AI-generated practice suggestions
  
  # ==============================================
  # Enhanced ConceptMastery (Add curriculum fields)
  # ==============================================
  # ADD these fields to the existing ConceptMastery type:
  # Curriculum alignment
  curriculumCode: String                 # "P3-NA-FR-1.1"
  curriculumStrand: String               # "Number and Algebra"
  curriculumSubStrand: String            # "Fractions"
  prerequisitesMastered: Boolean         # true if all prerequisites are mastered
  prerequisiteGaps: [String]             # ["P2-NA-FR-1.1"] missing prerequisites
  # ==============================================  
  
  # Metadata
  calculatedAt: AWSDateTime!
  lastUpdatedAt: AWSDateTime!
}

# ==============================================
# Error Pattern Analysis
# ==============================================

type ErrorPattern @model @auth(rules: [
  { allow: owner, ownerField: "studentId", operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  studentId: ID! @index(name: "byStudent", sortKeyFields: ["detectedAt"])
  classroomId: ID @index(name: "byClassroom")
  
  # Error classification
  errorType: String!                    # "Careless Mistake", "Conceptual Error", "Procedural Error"
  errorCategory: String!                # "Computation", "Sign Errors", "Multi-step Problems"
  severity: String!                     # "low", "medium", "high"
  
  # Frequency tracking
  occurrenceCount: Int!                 # How many times this error occurred
  firstSeen: AWSDateTime!
  lastSeen: AWSDateTime!
  
  # Context
  affectedConcepts: [String!]!          # Concepts where this error appears
  exampleQuestionIds: [String]          # Sample questions showing this error
  
  # Analysis
  description: String!                  # "Student often forgets to carry in addition"
  rootCause: String                     # AI-analyzed root cause
  remediation: String                   # Suggested intervention
  
  # Resolution tracking
  isResolved: Boolean!
  resolvedAt: AWSDateTime
  
  # Metadata
  detectedAt: AWSDateTime!
  lastAnalyzedAt: AWSDateTime!
  aiModel: String
}

# ==============================================
# Practice Problem Bank (for Sprint 7.4)
