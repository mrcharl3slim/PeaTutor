# ==============================================
# USAGE NOTES
# ==============================================
#
# 1. **WorksheetMetadata**: Created when worksheet is uploaded, extracted by AI
# 2. **QuestionMetadata**: Created for each question during extraction
# 3. **ConceptMastery**: Updated after each submission (quiz/homework)
# 4. **ErrorPattern**: Created/updated by AI analysis of incorrect answers
# 5. **PracticeProblem**: Generated on-demand (Sprint 7.4)
# 6. **StudentAnalyticsSummary**: Nightly aggregation job or on-demand calculation
#
# ==============================================

# ==============================================
# SPRINT 8: Curriculum Standards Integration
# Singapore MOE Primary Mathematics Syllabus 2021
# ==============================================

# ==============================================
# Curriculum Standard (Official Syllabus Topics)
# ==============================================

type CurriculumStandard @model @auth(rules: [
  { allow: private, operations: [read] }
]) {
  id: ID!
  
  # Curriculum identification
  country: String!                      # "SG" for Singapore
  curriculumName: String!               # "MOE Primary Mathematics"
  curriculumVersion: String!            # "2021"
  
  # Grade level
  gradeLevel: String!                   # "Primary 1", "Primary 2", etc.
  gradeLevelCode: String!               # "P1", "P2", "P3", etc.
  
  # Syllabus structure (hierarchical)
  strand: String!                       # "Number and Algebra", "Measurement and Geometry", "Statistics"
  strandCode: String!                   # "NA", "MG", "ST"
  subStrand: String!                    # "Whole Numbers", "Fractions", "Money", etc.
  subStrandCode: String!                # "WN", "FR", "MO", etc.
  
  # Topic details
  topicNumber: String!                  # "1", "2", "3" (main topic number)
  topicTitle: String!                   # "Numbers up to 100", "Addition and Subtraction"
  
  # Sub-topic details (the actual learning objective)
  subTopicCode: String!                 # "1.1", "1.2", "2.1", etc.
  subTopicDescription: String!          # "counting to tell the number of objects in a given set"
  
  # Full unique code for referencing
  # Format: P1-NA-WN-1.1 (GradeLevel-Strand-SubStrand-SubTopicCode)
  curriculumCode: String! @index(name: "byCurriculumCode", queryField: "standardByCode")
  
  # Searchable keywords for AI mapping
  keywords: [String!]!                  # ["counting", "objects", "set", "number"]
  
  # Learning progression
  sequenceOrder: Int!                   # Global ordering within grade (1, 2, 3...)
  prerequisiteCodes: [String]           # ["P1-NA-WN-1.0"] prior concepts needed
  
  # Additional metadata
  bulletPoints: [String]                # Sub-bullets like "• within 20", "• rectangle", etc.
  notes: String                         # Any additional notes from syllabus
  
  # Status
  isActive: Boolean!                    # For soft deprecation
  effectiveFrom: String                 # "2021" when this standard became effective
  effectiveUntil: String                # null if still current, "2025" if deprecated
}

# ==============================================
# Curriculum Topic Summary (Aggregated view)
# ==============================================

type CurriculumTopicSummary @model @auth(rules: [
  { allow: private, operations: [read] }
]) {
  id: ID!
  
  # Identification
  country: String!
  curriculumVersion: String!
  gradeLevel: String!
  gradeLevelCode: String!
  
  # Topic grouping
  strand: String!
  strandCode: String!
  subStrand: String!
  subStrandCode: String!
  topicNumber: String!
  topicTitle: String!
  
  # Unique topic code (without sub-topic)
  # Format: P1-NA-WN-1 (GradeLevel-Strand-SubStrand-TopicNumber)
  topicCode: String! @index(name: "byTopicCode", queryField: "topicSummaryByCode")
  
  # Aggregated data
  subTopicCount: Int!                   # Number of sub-topics under this topic
  subTopicCodes: [String!]!             # ["P1-NA-WN-1.1", "P1-NA-WN-1.2", ...]
  
  # All keywords from sub-topics (for search)
  allKeywords: [String!]!
  
  # Sequence
  sequenceOrder: Int!
  
  isActive: Boolean!
}
# ==============================================
# Student Curriculum Progress
# ==============================================

type StudentCurriculumProgress @model @auth(rules: [
  { allow: owner, ownerField: "studentId", operations: [create, update, delete, read] }
  { allow: private, operations: [read] }
]) {
  id: ID!
  studentId: ID! @index(name: "byStudent", sortKeyFields: ["gradeLevel"])
  classroomId: ID @index(name: "byClassroom")
  
  # Target curriculum
  country: String!                      # "SG"
  curriculumVersion: String!            # "2021"
  gradeLevel: String!                   # "Primary 2"
  gradeLevelCode: String!               # "P2"
  
  # Coverage metrics
  totalTopicsInGrade: Int!              # Total curriculum topics for this grade
  topicsAttempted: Int!                 # Topics with at least one attempt
  topicsMastered: Int!                  # Topics with 80%+ mastery
  topicsInProgress: Int!                # Topics with 50-79% mastery
  topicsNotStarted: Int!                # Topics with <50% or no attempts
  
  # Coverage percentage
  coveragePercentage: Float!            # (topicsAttempted / totalTopicsInGrade) * 100
  masteryPercentage: Float!             # (topicsMastered / totalTopicsInGrade) * 100
  
  # By strand breakdown (JSON encoded for flexibility)
  strandProgress: String!               # JSON: {"NA": {attempted: 5, mastered: 3}, "MG": {...}}
  
  # Detailed tracking
  masteredTopicCodes: [String!]!        # ["P2-NA-WN-1.1", "P2-NA-WN-1.2"]
  inProgressTopicCodes: [String!]!
  notStartedTopicCodes: [String!]!
  
  # Gaps and recommendations
  prerequisiteGaps: [String]            # Prerequisites not yet mastered
  recommendedNextTopics: [String]       # Next topics to focus on
  
  # Metadata
  lastCalculatedAt: AWSDateTime!
  lastUpdatedAt: AWSDateTime!
}
# ==============================================
# INDEXES FOR EFFICIENT QUERIES
# ==============================================
#
# Key query patterns supported:
#
# 1. Get all standards for a grade:
#    query { listCurriculumStandards(filter: {gradeLevel: {eq: "Primary 1"}}) }
#
# 2. Get standard by code:
#    query { standardByCode(curriculumCode: "P1-NA-WN-1.1") }
#
# 3. Get all standards for a strand in a grade:
#    query { listCurriculumStandards(filter: {
#      gradeLevel: {eq: "Primary 2"},
#      strand: {eq: "Number and Algebra"}
#    })}
#
# 4. Get student's curriculum progress:
#    query { listStudentCurriculumProgresses(filter: {studentId: {eq: "xxx"}}) }
#
# ==============================================

# ==============================================
# USAGE NOTES
# ==============================================
#
# 1. **CurriculumStandard**: Read-only reference data seeded from MOE syllabus
